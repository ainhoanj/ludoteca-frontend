<h2 mat-dialog-title>
    {{ id () ? 'Editar cliente' : 'Nuevo cliente'}}
</h2>

<mat-dialog-content>
    <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input matInput [ngModel]="name()" (ngModelChange)="name.set($event)" />
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onClose()">
        Cancelar
    </button>

    <button mat-flat-button color="primary" (click)="onSave()">
        Guardar
    </button>
</mat-dialog-actions>
